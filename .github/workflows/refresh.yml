name: Refresh model data

# Pulls the upstream llm-frontier JSON (derived from Artificial Analysis
# measurements), normalizes it into public/data/models.json (the served
# "latest" copy) plus a dated public/data/models-YYYY-MM-DD.json history file,
# and commits the result. The refresh script preserves the previous snapshot
# on any failure and skips the commit when measurements are unchanged.

on:
  schedule:
    - cron: '17 5 * * *' # once daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh snapshot
        run: python3 scripts/refresh.py
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/; then
            echo "measurements unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "model-atlas-refresh"
          git config user.email "model-atlas-refresh@users.noreply.github.com"
          git add public/data/
          git commit -m "data: refresh model snapshot $(date -u +%F)"
          git push
