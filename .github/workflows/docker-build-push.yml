name: Build and push Model Atlas image

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh model data]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: model-atlas-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data refresh
        run: python3 scripts/test_refresh.py
      - name: Identify checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/model-atlas" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create iac dispatch token
        id: iac-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.IAC_APP_ID }}
          private-key: ${{ secrets.IAC_APP_PRIVATE_KEY }}
          owner: Soren8
          repositories: iac
          permission-contents: write
      - name: Dispatch deployment to iac
        env:
          GH_TOKEN: ${{ steps.iac-token.outputs.token }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: >-
          gh api repos/Soren8/iac/dispatches
          --method POST
          --field event_type=managed-repo-push
          --field "client_payload[repo]=Soren8/model-atlas"
          --field "client_payload[sha]=$REVISION"
